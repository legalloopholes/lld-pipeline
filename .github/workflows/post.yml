name: Post next episode

# Runs about 2 hours before each posting time (12:00 and 7:00 pm New York time): a pixel episode takes ~35 min, up to
# 3 tries ~1 h 40 min. GitHub starts scheduled runs up to ~50 min late, so the first one may act up to 3 h early.
# Several UTC times are listed because GitHub's schedule is in UTC and New York changes clocks
# (and GitHub sometimes skips a scheduled run); run.py works out the real slot, skips runs outside a posting window
# (EARLY in run.py) and makes sure each slot is handled once, so the extra runs are backups that do nothing.
on:
  schedule:
    - cron: '5 14,15,21,22 * * *'
    - cron: '35 15,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = render + check accounts, no posting.  live = post the next episode now.  tiktok = re-send one episode to the TikTok inbox.'
        type: choice
        options: [test, live, tiktok]
        default: test
      video_id:
        description: 'for tiktok: the Video ID to re-send, e.g. LLD-002'
        type: string
        default: ''

concurrency:
  group: lld-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Is it time to post?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ vars.LIVE }}" != "true" ]; then
            echo "Scheduled posting is off (repository variable LIVE is not 'true'). Nothing to do."
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          W=$(python3 run.py window); echo "posting window: $W"
          echo "go=$W" >> "$GITHUB_OUTPUT"

      - name: Secrets to files (hidden from the log)
        if: steps.gate.outputs.go == 'yes'
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
          YOUTUBE_JSON: ${{ secrets.YOUTUBE_JSON }}
          META_JSON: ${{ secrets.META_JSON }}
          GH_MEDIA_JSON: ${{ secrets.GH_MEDIA_JSON }}
          TIKTOK_JSON: ${{ secrets.TIKTOK_JSON }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          set -e
          umask 077
          mkdir -p ~/.n8n-files/secrets
          python3 - <<'PY'
          import os, json
          out = os.path.expanduser('~/.n8n-files/secrets')
          files = {'GOOGLE_SHEETS_JSON': 'google_sheets.json', 'YOUTUBE_JSON': 'youtube.json', 'META_JSON': 'meta.json',
                   'GH_MEDIA_JSON': 'github.json', 'TIKTOK_JSON': 'tiktok.json'}
          def mask(v):
              if isinstance(v, dict): [mask(x) for x in v.values()]
              elif isinstance(v, list): [mask(x) for x in v]
              elif isinstance(v, str) and len(v) >= 8: print('::add-mask::' + v)
          for env, name in files.items():
              raw = os.environ.get(env, '')
              if not raw: print(f'missing secret {env}'); continue
              d = json.loads(raw); mask(d)
              json.dump(d, open(os.path.join(out, name), 'w'))
          PY
          # newest TikTok login (tokens rotate) is kept encrypted in the repo after the first live post
          if [ -f state/tiktok.json.enc ] && [ -n "$STATE_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in state/tiktok.json.enc -out ~/.n8n-files/secrets/tiktok.json -pass env:STATE_KEY
            python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/.n8n-files/secrets/tiktok.json')));[print('::add-mask::'+v) for v in d.values() if isinstance(v,str) and len(v)>=8]"
          fi
          ln -sfn "$GITHUB_WORKSPACE/scenes" ~/.n8n-files/scenes
          ln -sfn "$GITHUB_WORKSPACE/assets" ~/.n8n-files/assets
          ln -sfn "$GITHUB_WORKSPACE/larry-3d" ~/.n8n-files/larry-3d

      - name: System packages cache (ffmpeg and fonts as .deb files, so no Ubuntu mirror is needed)
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu2404-ffmpeg-fonts-v1

      - name: System packages and fonts
        if: steps.gate.outputs.go == 'yes'
        timeout-minutes: 20
        run: |
          # 2026-11-11: an Ubuntu mirror stalled apt for 81 min and the noon post went out late. Now the packages come from
          # the cache above (no network); only if that fails is the mirror used, with timeouts and retries.
          PKGS="ffmpeg fonts-noto-color-emoji fonts-liberation fonts-dejavu-core"
          if ls ~/apt-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/apt-debs/*.deb >/dev/null 2>&1 && command -v ffmpeg >/dev/null; then
            echo "packages installed from cache ($(ls ~/apt-debs/*.deb | wc -l) files)"
          else
            sudo dpkg --configure -a || true
            mkdir -p ~/apt-debs/partial
            A="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::archives=$HOME/apt-debs"
            for i in 1 2 3; do
              sudo timeout 240 apt-get update -q $A && sudo timeout 300 apt-get install -y -q -f $A $PKGS && break
              echo "apt try $i failed; retrying"; sleep 10
            done
            sudo chown -R "$USER" ~/apt-debs; rm -rf ~/apt-debs/partial ~/apt-debs/lock
          fi
          command -v ffmpeg || { echo "::error::ffmpeg could not be installed"; exit 1; }
          mkdir -p ~/.local/share/fonts ~/.config/fontconfig
          cp fonts/*/*.ttf ~/.local/share/fonts/
          cp fonts/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f
          fc-match "Arial Rounded MT Bold:bold"; fc-match "Arial Black"; fc-match Georgia

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages
        if: steps.gate.outputs.go == 'yes'
        run: |
          pip install -q -r requirements.txt

      - name: Caption model (Parakeet) cache
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.n8n-files/aligner-models
          key: parakeet-tdt-0.6b-v2-int8

      - name: Voice model (Chatterbox) cache
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voices-chatterbox-0.1.7

      - name: Caption model download (first run only)
        if: steps.gate.outputs.go == 'yes'
        run: |
          M=~/.n8n-files/aligner-models
          if [ ! -f $M/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/encoder.int8.onnx ]; then
            mkdir -p $M && cd $M
            curl -sSL -o p.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2
            tar xjf p.tar.bz2 && rm p.tar.bz2
          fi
          ls ~/.n8n-files/aligner-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8

      - name: Music cache (Kevin MacLeod tracks, downloaded on first use)
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.n8n-files/music
          key: music-${{ hashFiles('assets/music.json') }}

      - name: Your own sound effects (encrypted in the repo, key in SFX_KEY; made by tools/sfx_pack.sh)
        if: steps.gate.outputs.go == 'yes'
        env:
          SFX_KEY: ${{ secrets.SFX_KEY }}
        run: |
          if [ -n "$SFX_KEY" ] && [ -f assets/sfx.tgz.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:SFX_KEY -in assets/sfx.tgz.enc | tar xzf - -C assets
            echo "own sound effects: $(ls assets/sfx | tr '\n' ' ')"
          else
            echo "::warning::No SFX_KEY / assets/sfx.tgz.enc yet: only the Freesound sounds will play (run tools/sfx_pack.sh on the Mac)"
          fi

      - name: Sound effects cache (Freesound CC0, downloaded on first use)
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.n8n-files/sfx-cache
          key: sfx-${{ hashFiles('assets/sfx_sources.json') }}

      - name: Playwright browser cache
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.48.2-chromium

      - name: 3D renderer
        if: steps.gate.outputs.go == 'yes'
        working-directory: larry-3d
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start voice server
        if: steps.gate.outputs.go == 'yes'
        run: |
          # Larry's voice is Chatterbox, always (the old Kokoro voice was removed for good, 2026-11-10).
          # Own venv: chatterbox pins its own torch/transformers. Unmaintained since Aug 2026 - keep this exact version.
          python -m venv /tmp/cb
          /tmp/cb/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/cb/bin/pip install -q chatterbox-tts==0.1.7 "setuptools<81"   # its watermarker needs pkg_resources (gone in setuptools 81+)
          nohup /tmp/cb/bin/python lld/tts_chatterbox.py > /tmp/tts.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8300/health >/dev/null && break; sleep 5; done
          curl -sf http://127.0.0.1:8300/health || (cat /tmp/tts.log; exit 1)

      - name: Run
        if: steps.gate.outputs.go == 'yes'
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
          LLD_FONT: ${{ github.workspace }}/fonts/mplusrounded1c/MPLUSRounded1c-ExtraBold.ttf
        run: |
          if [ "$MODE" = "live" ] && [ "${{ github.event_name }}" != "schedule" ]; then python run.py live --now
          elif [ "$MODE" = "tiktok" ]; then python run.py tiktok "$VIDEO_ID"
          else python run.py "$MODE"; fi
